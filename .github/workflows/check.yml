# SPDX-License-Identifier: EUPL-1.2
# Builds ci.nix (Linux packages, Clippy, rustfmt, unit tests, policy checks) on
# the self-hosted runner. Pull requests from forks never run there.
name: Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - run: nix build -f ci.nix --no-link --keep-going -L
