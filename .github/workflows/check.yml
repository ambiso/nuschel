# SPDX-License-Identifier: EUPL-1.2
# CI in three tiers on the repository's self-hosted runner (scripts/ci-tiers
# lists each tier; scripts/pre-pr runs tier 1 locally):
#   1. every push and pull request: Linux package builds, workspace Clippy and
#      rustfmt, unit-test leaves, worker-boundary and policy checks, and build
#      plus Clippy for each earlier commit of the pushed range;
#   2. pushes to main, the nightly schedule, manual runs and pushes to ci/*
#      branches: the NixOS VM fixtures;
#   3. the nightly schedule, manual runs and ci/* pushes: release proofs.
# Windows/macOS cross builds and release archives stay in build.yml (tags and
# manual runs only). "CI result (pull_request)" is the check to require.
#
# Trust boundary: self-hosted jobs run ONLY for pushes to this repository,
# schedules, manual dispatch, and pull requests whose head branch lives in this
# repository. Fork pull requests never reach the self-hosted runner from this
# file; they get the hosted lint job and a failing "CI result" that asks a
# maintainer to push the reviewed branch here. A fork can edit this file in its
# pull request, so these `if:` gates are not the enforcement point on their
# own: the repository's fork approval policy and the runner's job-started hook
# are (see the pull request that added this workflow).
#
# No secrets, no write permission, no stored credentials, and every Nix build
# runs in the daemon's sandbox. Nix is never installed on the self-hosted
# runner by a job; the preflight fails if it is missing.
name: Check

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Superseded runs of a branch or pull request are cancelled; their commits are
# checked again by the next run (Nix reuses everything that already finished).
# Every push to main and every scheduled run keeps its own run.
concurrency:
  group: check-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NIX_CONFIG: |
    extra-experimental-features = nix-command flakes
    accept-flake-config = false
  # Earlier commits of a range checked besides its head (build, Clippy, rustfmt).
  MAX_EARLIER_COMMITS: "8"

jobs:
  preflight:
    name: Runner preflight
    if: >-
      github.event_name == 'push' || github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    outputs:
      cores: ${{ steps.runner.outputs.cores }}
      max-jobs: ${{ steps.runner.outputs.max-jobs }}
      kvm: ${{ steps.runner.outputs.kvm }}
      head: ${{ steps.range.outputs.head }}
      earlier: ${{ steps.range.outputs.earlier }}
    steps:
      - name: Check Nix, KVM, memory and disk
        id: runner
        env:
          OVERRIDE_CORES: ${{ vars.NUSCHL_CI_CORES }}
          OVERRIDE_MAX_JOBS: ${{ vars.NUSCHL_CI_MAX_JOBS }}
        run: |
          # The runner service's PATH is minimal: bash builtins, coreutils, grep, git and nix.
          set -u
          fail() { printf '::error title=Runner preflight::%s\n' "$*"; exit 1; }
          note() { printf '%s\n' "$*" | tee -a "$GITHUB_STEP_SUMMARY"; }
          number() { [[ $2 =~ ^[0-9]+$ ]] || fail "Cannot determine $1 (got '$2')."; }
          free_gib() { df --output=avail -B1G "$1" | tail -n 1 | tr -d ' '; }

          command -v nix >/dev/null 2>&1 ||
            fail "nix is not on PATH for runner user $(id -un). Install multi-user Nix on the runner host;" \
              'jobs never install it there.'
          nix_version=$(nix --version) || fail 'nix --version failed'
          store_info=$(nix store info --json) || fail 'Cannot reach the Nix daemon/store as the runner user.'
          sandbox=$(nix config show sandbox) || fail "'nix config show' failed; Nix 2.20 or newer is required."
          [[ $sandbox == true || $sandbox == relaxed ]] ||
            fail "Nix sandbox is '$sandbox'; CI builds require 'sandbox = true'."
          features=$(nix config show system-features)
          build_dir=$(nix config show build-dir 2>/dev/null || true)
          [[ -n $build_dir && -d $build_dir ]] || build_dir=/tmp

          threads=$(nproc)
          mem_kib=
          avail_kib=
          while read -r key value _; do
            case $key in
              MemTotal:) mem_kib=$value ;;
              MemAvailable:) avail_kib=$value ;;
            esac
          done < /proc/meminfo
          number 'total memory' "$mem_kib"
          number 'available memory' "$avail_kib"
          mem_gib=$(( mem_kib / 1048576 ))
          avail_gib=$(( avail_kib / 1048576 ))
          store_free=$(free_gib /nix/store)
          build_free=$(free_gib "$build_dir")
          number 'free space in /nix/store' "$store_free"
          number "free space in $build_dir" "$build_free"

          # Up to four parallel derivations, each with at least 4 threads and 8 GiB.
          jobs=${OVERRIDE_MAX_JOBS:-$(( threads / 4 ))}
          if [[ -z $OVERRIDE_MAX_JOBS ]]; then
            (( jobs > mem_gib / 8 )) && jobs=$(( mem_gib / 8 ))
            (( jobs > 4 )) && jobs=4
            (( jobs < 1 )) && jobs=1
          fi
          [[ $jobs =~ ^[1-9][0-9]?$ ]] || fail "NUSCHL_CI_MAX_JOBS must be 1-99, not '$jobs'"
          cores=${OVERRIDE_CORES:-$(( threads / jobs ))}
          [[ $cores =~ ^[1-9][0-9]{0,2}$ ]] || fail "NUSCHL_CI_CORES must be 1-999, not '$cores'"

          # NixOS tests run inside the daemon's builders, which need these features;
          # the runner service itself may not see /dev/kvm (systemd PrivateDevices).
          kvm=false
          if [[ " $features " == *" kvm "* && " $features " == *" nixos-test "* ]]; then kvm=true; fi
          kvm_note='not visible to the runner service'
          if [[ -c /dev/kvm ]]; then kvm_note='visible to the runner service'; fi

          note '### Runner'
          note "- runner \`$RUNNER_NAME\` on $(uname -srm), user \`$(id -un)\`"
          note "- $nix_version, sandbox \`$sandbox\`, system-features \`$features\`"
          note "- Nix daemon store info: \`$store_info\`"
          note "- $threads threads, $mem_gib GiB memory ($avail_gib GiB available)"
          note "- free: /nix/store $store_free GiB, build dir \`$build_dir\` $build_free GiB"
          note "- NixOS VM tests possible (daemon kvm + nixos-test): $kvm; /dev/kvm $kvm_note"
          note "- Nix builds use --max-jobs $jobs --cores $cores"

          if [[ $store_info == *'"trusted":1'* || $store_info == *'"trusted":true'* ]]; then
            printf '::warning title=Runner preflight::%s\n' \
              "The Nix daemon trusts runner user $(id -un); a job could change substituters or sandbox settings."
          fi
          (( store_free >= 20 )) || fail "Only $store_free GiB free in /nix/store; at least 20 GiB is required."
          (( build_free >= 8 )) ||
            fail "Only $build_free GiB free in the Nix build directory $build_dir; at least 8 GiB is required."

          {
            printf 'cores=%s\n' "$cores"
            printf 'max-jobs=%s\n' "$jobs"
            printf 'kvm=%s\n' "$kvm"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select the commits to check
        id: range
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          head=$(git rev-parse HEAD)
          # The range starts where this push or pull request left main.
          candidate=
          case $EVENT:$REF in
            pull_request:*) candidate=$PR_BASE ;;
            push:refs/heads/main) candidate=$BEFORE ;;
            push:*) candidate=$(git rev-parse --verify --quiet refs/remotes/origin/main || true) ;;
          esac
          base=
          if [[ $candidate =~ ^[0-9a-f]{40}$ && $candidate != 0000000000000000000000000000000000000000 ]] &&
             git cat-file -e "$candidate^{commit}" 2>/dev/null; then
            base=$(git merge-base "$candidate" "$head" || true)
          fi
          range=()
          if [[ -n $base ]]; then
            mapfile -t range < <(git rev-list --first-parent "$base..$head")
          fi
          # range[0] is the head; keep the newest MAX_EARLIER_COMMITS before it.
          earlier=("${range[@]:1:$MAX_EARLIER_COMMITS}")
          skipped=0
          if (( ${#range[@]} > 1 )); then skipped=$(( ${#range[@]} - 1 - ${#earlier[@]} )); fi
          {
            echo '### Commits'
            echo "- head \`$head\`; base \`${base:-none}\`"
            echo "- earlier first-parent commits checked: ${#earlier[@]}; beyond the cap of $MAX_EARLIER_COMMITS: $skipped"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if (( skipped > 0 )); then
            printf '::warning title=Commit range::%s\n' "$skipped older commits of this range are not checked individually."
          fi
          printf 'head=%s\nearlier=%s\n' "$head" "${earlier[*]}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (Nix)
    needs: preflight
    if: >-
      github.event_name == 'push' || github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 240
    env:
      CORES: ${{ needs.preflight.outputs.cores }}
      MAX_JOBS: ${{ needs.preflight.outputs.max-jobs }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ needs.preflight.outputs.head }}
          fetch-depth: 0
          persist-credentials: false

      - name: Desktop, terminal, helpers, server, RTC probe, web relay and web site
        run: |
          list=$(scripts/ci-tiers build)
          [[ -n $list ]] || { echo "::error::scripts/ci-tiers build selected nothing"; exit 1; }
          mapfile -t installables <<<"$list"
          printf '%s\n' "${installables[@]}"
          nix build --no-link --print-out-paths -L --keep-going --cores "$CORES" --max-jobs "$MAX_JOBS" \
            "${installables[@]}"

  clippy:
    name: Clippy and rustfmt
    needs: preflight
    if: >-
      github.event_name == 'push' || github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 240
    env:
      CORES: ${{ needs.preflight.outputs.cores }}
      MAX_JOBS: ${{ needs.preflight.outputs.max-jobs }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ needs.preflight.outputs.head }}
          fetch-depth: 0
          persist-credentials: false

      - name: Workspace Clippy with --all-targets --deny warnings, and rustfmt
        run: |
          list=$(scripts/ci-tiers lint)
          [[ -n $list ]] || { echo "::error::scripts/ci-tiers lint selected nothing"; exit 1; }
          mapfile -t installables <<<"$list"
          printf '%s\n' "${installables[@]}"
          nix build --no-link --print-out-paths -L --keep-going --cores "$CORES" --max-jobs "$MAX_JOBS" \
            "${installables[@]}"

  tests:
    name: Unit tests and policy checks
    needs: preflight
    if: >-
      github.event_name == 'push' || github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 240
    env:
      CORES: ${{ needs.preflight.outputs.cores }}
      MAX_JOBS: ${{ needs.preflight.outputs.max-jobs }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ needs.preflight.outputs.head }}
          fetch-depth: 0
          persist-credentials: false

      - name: Unit-test leaves, worker boundaries, dependency policy, crate2nix graph, modules
        run: |
          list=$(scripts/ci-tiers unit)
          [[ -n $list ]] || { echo "::error::scripts/ci-tiers unit selected nothing"; exit 1; }
          mapfile -t installables <<<"$list"
          printf '%s\n' "${installables[@]}"
          nix build --no-link --print-out-paths -L --keep-going --cores "$CORES" --max-jobs "$MAX_JOBS" \
            "${installables[@]}"

  commits:
    name: Earlier commits (build, Clippy, rustfmt)
    needs: preflight
    if: >-
      github.event_name == 'push' || github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 360
    env:
      CORES: ${{ needs.preflight.outputs.cores }}
      MAX_JOBS: ${{ needs.preflight.outputs.max-jobs }}
      EARLIER: ${{ needs.preflight.outputs.earlier }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ needs.preflight.outputs.head }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check each earlier commit of the range
        run: |
          read -r -a commits <<<"$EARLIER"
          if (( ${#commits[@]} == 0 )); then
            echo 'No earlier commits in this range; the other jobs check its head.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo '| Commit | Result | Minutes |'
            echo '| --- | --- | --- |'
          } >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for sha in "${commits[@]}"; do
            [[ $sha =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Unexpected commit id"; exit 1; }
            git log -1 --format='Checking %H %s' "$sha"
            flake="git+file://$GITHUB_WORKSPACE?rev=$sha"
            start=$SECONDS
            if list=$(scripts/ci-tiers --flake "$flake" build && scripts/ci-tiers --flake "$flake" lint) &&
               mapfile -t installables <<<"$list" &&
               nix build --no-link --print-out-paths -L --keep-going --cores "$CORES" --max-jobs "$MAX_JOBS" \
                 "${installables[@]}"; then
              result=pass
            else
              result=FAIL
              failed=$(( failed + 1 ))
              echo "::error title=Earlier commit::$sha failed its build, Clippy or rustfmt check"
            fi
            echo "| \`${sha:0:12}\` | $result | $(( (SECONDS - start + 59) / 60 )) |" >> "$GITHUB_STEP_SUMMARY"
          done
          (( failed == 0 ))

  vm:
    name: NixOS VM fixtures (main, nightly)
    needs: [preflight, build]
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/ci/')))
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 240
    env:
      CORES: ${{ needs.preflight.outputs.cores }}
      MAX_JOBS: ${{ needs.preflight.outputs.max-jobs }}
    steps:
      - name: Require KVM and the nixos-test system feature
        if: needs.preflight.outputs.kvm != 'true'
        run: |
          echo '::error title=NixOS VM fixtures::The Nix daemon on this runner lacks the kvm and nixos-test system features.'
          exit 1

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ needs.preflight.outputs.head }}
          fetch-depth: 0
          persist-credentials: false

      - name: Each VM fixture, timed
        run: |
          list=$(scripts/ci-tiers nightly)
          [[ -n $list ]] || { echo "::error::scripts/ci-tiers nightly selected nothing"; exit 1; }
          mapfile -t installables <<<"$list"
          echo '| VM fixture | Result | Minutes |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | --- | --- |' >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for installable in "${installables[@]}"; do
            start=$SECONDS
            if nix build --no-link --print-out-paths -L --cores "$CORES" --max-jobs "$MAX_JOBS" "$installable"; then
              result=pass
            else
              result=FAIL
              failed=$(( failed + 1 ))
              echo "::error title=NixOS VM fixtures::${installable##*.} failed"
            fi
            echo "| ${installable##*.} | $result | $(( (SECONDS - start + 59) / 60 )) |" >> "$GITHUB_STEP_SUMMARY"
          done
          (( failed == 0 ))

  release-proofs:
    name: Release proofs (nightly)
    needs: preflight
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/'))
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 240
    env:
      CORES: ${{ needs.preflight.outputs.cores }}
      MAX_JOBS: ${{ needs.preflight.outputs.max-jobs }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ needs.preflight.outputs.head }}
          fetch-depth: 0
          persist-credentials: false

      - name: Linux distribution packaging proofs
        run: |
          list=$(scripts/ci-tiers release)
          [[ -n $list ]] || { echo "::error::scripts/ci-tiers release selected nothing"; exit 1; }
          mapfile -t installables <<<"$list"
          printf '%s\n' "${installables[@]}"
          nix build --no-link --print-out-paths -L --keep-going --cores "$CORES" --max-jobs "$MAX_JOBS" \
            "${installables[@]}"

  # Hosted and unprivileged: runs for every pull request, including forks.
  pr-lint:
    name: Formatting and workflow lint (hosted)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd # v31.9.1
        with:
          extra_nix_config: |
            cores = 2
            max-jobs = 2

      - name: rustfmt and the generated crate2nix graph
        run: |
          nix build --no-link -L --cores 2 --max-jobs 2 \
            .#checks.x86_64-linux.fmt .#checks.x86_64-linux.crate2nix-current

      - name: actionlint with shellcheck
        run: nix shell --inputs-from . nixpkgs#actionlint nixpkgs#shellcheck --command actionlint -color

  # The one check to require, as "CI result (pull_request)": it runs for every
  # event, fails for fork pull requests, and fails unless every job that applies
  # to the event succeeded. A job skipped by `if:` would otherwise count as
  # passing. The event in its name keeps push and pull request results apart.
  result:
    name: CI result (${{ github.event_name }})
    if: always()
    needs: [preflight, build, clippy, tests, commits, vm, release-proofs, pr-lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every applicable check
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          PREFLIGHT: ${{ needs.preflight.result }}
          BUILD: ${{ needs.build.result }}
          CLIPPY: ${{ needs.clippy.result }}
          TESTS: ${{ needs.tests.result }}
          COMMITS: ${{ needs.commits.result }}
          VM: ${{ needs.vm.result }}
          RELEASE_PROOFS: ${{ needs.release-proofs.result }}
          PR_LINT: ${{ needs.pr-lint.result }}
        run: |
          if [[ $EVENT == pull_request && $HEAD_REPO != "$REPOSITORY" ]]; then
            message='Builds, Clippy, tests and VMs run only on the self-hosted runner, never for forks.'
            message+=' After review, a maintainer pushes the branch to this repository and opens a pull request from it.'
            echo "::error title=Fork pull request::$message"
            exit 1
          fi
          nightly=false
          release=false
          case $EVENT:$REF in
            schedule:* | workflow_dispatch:*) nightly=true; release=true ;;
            push:refs/heads/ci/*) nightly=true; release=true ;;
            push:refs/heads/main) nightly=true ;;
          esac
          status=0
          expect() {
            local name=$1 result=$2 applies=$3
            printf '%-15s %-8s (required: %s)\n' "$name" "$result" "$applies"
            if [[ $applies == true && $result != success ]]; then status=1; fi
            if [[ $applies == false && $result != skipped ]]; then status=1; fi
          }
          expect preflight "$PREFLIGHT" true
          expect build "$BUILD" true
          expect clippy "$CLIPPY" true
          expect tests "$TESTS" true
          expect commits "$COMMITS" true
          expect vm "$VM" "$nightly"
          expect release-proofs "$RELEASE_PROOFS" "$release"
          expect pr-lint "$PR_LINT" "$([[ $EVENT == pull_request ]] && echo true || echo false)"
          exit "$status"
