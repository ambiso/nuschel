# SPDX-License-Identifier: EUPL-1.2
# Tags trigger read-only builds. Signing and publication are LOCAL operator actions.
# No hosted signing secret, contents-write authority or release upload exists here.
name: Release builds
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-builds-${{ github.ref }}
  cancel-in-progress: false
jobs:
  builds:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
