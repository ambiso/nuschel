# SPDX-License-Identifier: EUPL-1.2
#
# Tag vX.Y.Z (matching the workspace version) to publish a release. Everything
# is built by the Nix flake on one Linux runner: Windows with MinGW, macOS
# (x86_64 + arm64, lipo'd and ad-hoc signed) with zig and the pinned SDK, so no
# macOS runner is needed. The signed update.json lets installed copies update
# themselves (crates/update).
#
# Needs the repository secret UPDATE_SIGNING_KEY: the unencrypted minisign
# secret key whose public half is release/update-key.pub.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd # v31.9.1

      - name: The tag matches the workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build for Windows (cross)
        run: nix build .#windows -o result-windows -L

      - name: Build for macOS (cross, universal app)
        run: nix build .#macos-app -o result-macos -L

      - name: Arrange the installations
        run: |
          mkdir -p install/windows/licenses dist
          cp result-windows/bin/*.exe install/windows/
          cp result-windows/share/licenses/nuschel/EUPL-1.2 install/windows/licenses/
          cp -r result-macos/Nuschel.app install/Nuschel.app
          chmod -R u+w install
          (cd install/windows && nix shell nixpkgs#zip -c zip -qr "../../dist/nuschel-$VERSION-windows-x86_64.zip" .)
          (cd install && nix shell nixpkgs#zip -c zip -qry "../dist/nuschel-$VERSION-macos-universal.zip" Nuschel.app)

      - name: Signed update manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          key="$RUNNER_TEMP/update-key.secret"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key"
          nix shell nixpkgs#rsign2 nixpkgs#python3 -c python3 release/make-update.py \
            --version "$VERSION" \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/" \
            --notes "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
            --platform windows-x86_64=install/windows \
            --platform macos-universal=install/Nuschel.app \
            --output dist --sign-key "$key"
          nix shell nixpkgs#rsign2 -c rsign verify -p release/update-key.pub -x dist/update.json.minisig dist/update.json

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "Nuschel $VERSION" --generate-notes "${prerelease[@]}"
