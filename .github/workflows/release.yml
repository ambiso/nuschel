# SPDX-License-Identifier: EUPL-1.2
# Publication is separate from read-only reusable builds. No key generation,
# enrollment, legacy-signature fallback or absent-secret bypass exists here.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  builds:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
  publish:
    needs: builds
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd # v31.9.1
        with:
          extra_nix_config: |
            cores = 2
            max-jobs = 2
            build-dir = /nix/var/nix/builds
      - name: Prepare disk-backed Nix scratch
        run: sudo mkdir -p /nix/var/nix/builds
      - name: Require exact tag and enrolled hybrid trust before secret access
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, tomllib
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['workspace']['package']['version']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?', version) or os.environ['GITHUB_REF_NAME'] != 'v' + version:
              raise SystemExit('tag must match the source workspace version')
          trust = json.loads(pathlib.Path('crates/update/update-trust.json').read_text())
          if trust.get('format') != 2 or trust.get('algorithm') != 'ed25519+mldsa44' or not trust.get('keys'):
              raise SystemExit('production hybrid public pair has not been enrolled; publication is blocked')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('VERSION=' + version + '\n')
          PY
      # SHA verified against the official actions/download-artifact v4.3.0 tag.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.builds.outputs.windows-artifact }}
          path: artifacts/windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.builds.outputs.macos-artifact }}
          path: artifacts/macos
      - name: Validate same-run artifacts, install paths, hybrid helpers and actual notices
        run: |
          python3 release/prepare-artifacts.py \
            --artifact windows-x86_64=artifacts/windows \
            --artifact macos-universal=artifacts/macos \
            --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --version "$VERSION" --output install
      - name: Build the explicit offline signer
        run: nix build .#update-signer -o result-update-signer --cores 2 --max-jobs 2 -L
      - name: Match the CI pair, sign exact v2 bytes and verify before publication
        env:
          UPDATE_HYBRID_SIGNING_KEY: ${{ secrets.UPDATE_HYBRID_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$UPDATE_HYBRID_SIGNING_KEY" ]]; then
            echo 'UPDATE_HYBRID_SIGNING_KEY is absent; publication is blocked.' >&2
            exit 1
          fi
          umask 077
          key="$RUNNER_TEMP/update-v2.secret.json"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$UPDATE_HYBRID_SIGNING_KEY" > "$key"
          unset UPDATE_HYBRID_SIGNING_KEY
          python3 release/make-update.py --version "$VERSION" \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/" \
            --notes "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
            --platform windows-x86_64=install/windows --platform macos-universal=install/Nuschl.app \
            --output dist --sign-key "$key" --public-key crates/update/update-trust.json \
            --signer result-update-signer/bin/nuschl-update-sign
      - name: Arrange portable archives from the checked installation trees
        run: |
          (cd install/windows && nix shell --cores 2 --max-jobs 2 --inputs-from "$GITHUB_WORKSPACE" nixpkgs#zip -c zip -qr "../../dist/nuschl-$VERSION-windows-x86_64.zip" .)
          (cd install && nix shell --cores 2 --max-jobs 2 --inputs-from "$GITHUB_WORKSPACE" nixpkgs#zip -c zip -qr "../dist/nuschl-$VERSION-macos-universal.zip" Nuschl.app)
      - name: Publish only fully prepared artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "Nuschl $VERSION" --generate-notes "${prerelease[@]}"
