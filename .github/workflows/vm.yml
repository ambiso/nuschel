# SPDX-License-Identifier: EUPL-1.2
# The NixOS VM smoke test on the self-hosted runner: after each push to main,
# nightly and on demand. Never for pull requests.
name: VM smoke test
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vm-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  vm-smoke:
    runs-on: self-hosted
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - run: nix --extra-experimental-features 'nix-command flakes' build .#checks.x86_64-linux.vm-smoke --no-link -L
