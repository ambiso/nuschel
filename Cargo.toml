[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
exclude = ["vendor/cpal", "vendor/pulseaudio", "vendor/gpui-pre-windows", "vendor/gpui-pre-linux", "vendor/str0m-rust-crypto", "vendor/ratatui-image", "vendor/gpui-pre-apple", "vendor/gpui-pre-wgpu", "vendor/gpui-pre", "vendor/hpke-rs-libcrux", "vendor/openmls_libcrux_crypto", "vendor/magic-wormhole", "vendor/speexdsp-resampler", "vendor/opus-pure"]
default-members = ["apps/desktop", "apps/server"]

[workspace.metadata.crane]
name = "nuschl"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "EUPL-1.2"
publish = false

[workspace.dependencies]
nuschl-core = { path = "crates/core", version = "0.1.0" }
nuschl-client = { path = "crates/client", version = "0.1.0" }
nuschl-content = { path = "crates/content", version = "0.1.0" }
nuschl-ipc = { path = "crates/ipc", version = "0.1.0" }
nuschl-sandbox-windows = { path = "crates/sandbox-windows", version = "0.1.0" }
nuschl-legacy-html = { path = "crates/legacy-html", version = "0.1.0" }
nuschl-math = { path = "crates/math", version = "0.1.0" }
nuschl-protocol = { path = "crates/protocol", version = "0.1.0" }
nuschl-storage = { path = "crates/storage", version = "0.1.0" }
nuschl-update = { path = "crates/update", version = "0.1.0" }
nuschl-link-preview = { path = "crates/link-preview", version = "0.1.0" }
nuschl-identity = { path = "crates/identity", version = "0.1.0" }
nuschl-kt = { path = "crates/kt", version = "0.1.0" }
nuschl-e2ee = { path = "crates/e2ee", version = "0.1.0" }

nuschl-session = { path = "crates/session", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

# Dependencies keep line tables only (file:line in backtraces and stepping, no variable
# or type information): a debug build of nuschl-content was 349 MB instead of 457 MB
# (2026-11-11); our own crates keep full debug info. To debug inside one dependency, rebuild just that crate with
# `cargo build --config 'profile.dev.package."<crate>".debug=true'`.
[profile.dev.package."*"]
debug = "line-tables-only"
[profile.dev.package.rsa]
opt-level = 3
# Key transparency (nuschl-kt): the VRF and tree hashing are ~100x slower unoptimised.
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.akd]
opt-level = 3
[profile.dev.package.akd_core]
opt-level = 3
[profile.dev.package.blake3]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[patch.crates-io]
# Explicit receive-only Mumble intensity-stereo phase control.
opus-pure = { path = "vendor/opus-pure" }
# Scalar Rust playback SRC: no allocation in the f32 path, correct LR memory base.
speexdsp-resampler = { path = "vendor/speexdsp-resampler" }
# Safe Rust terminal graphics encoding; source formats stay in workers.
ratatui-image = { path = "vendor/ratatui-image" }
# Explicit RustCrypto DTLS provider and memory-safe certificate generation.
str0m-rust-crypto = { path = "vendor/str0m-rust-crypto" }
# Relay-only connections must not dial a peer's purported relay address.
# See vendor/magic-wormhole/NUSCHEL-PATCH.md.
magic-wormhole = { path = "vendor/magic-wormhole" }
# Stream names and roles for volume mixers (see vendor/cpal/NUSCHEL-PATCHES.md).
cpal = { path = "vendor/cpal" }
pulseaudio = { path = "vendor/pulseaudio" }
# Cross-compilation fixes for GPUI's platform crates (see vendor/*/NUSCHEL-PATCH.md).
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
# Typed image clipboard support (vendor/gpui-pre-linux/NUSCHL-PATCH.md).
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
# Colour emoji on Linux (vendor/gpui-pre-wgpu/NUSCHEL-PATCH.md).
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }
# Window zoom (Ctrl+= / Ctrl+-) scaling everything like a browser (vendor/gpui-pre/NUSCHEL-PATCH.md).
gpui-pre = { path = "vendor/gpui-pre" }
# OpenMLS 0.9.2's libcrux provider on the fixed libcrux crates (libcrux-kem 0.0.10,
# libcrux-hmac-drbg 0.0.2; RUSTSEC-2026-0329/-0330/-0331). Manifest changes only;
# remove both with the OpenMLS release that carries them (vendor/*/NUSCHEL-PATCH.md,
# TODO.md).
hpke-rs-libcrux = { path = "vendor/hpke-rs-libcrux" }
openmls_libcrux_crypto = { path = "vendor/openmls_libcrux_crypto" }
