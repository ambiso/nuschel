[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
exclude = ["vendor/pulseaudio", "vendor/gpui-pre-windows", "vendor/gpui-pre-apple"]
default-members = ["apps/desktop", "apps/server"]

[workspace.metadata.crane]
name = "nuschel"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "EUPL-1.2"
publish = false

[workspace.dependencies]
nuschel-core = { path = "crates/core", version = "0.1.0" }
nuschel-client = { path = "crates/client", version = "0.1.0" }
nuschel-content = { path = "crates/content", version = "0.1.0" }
nuschel-ipc = { path = "crates/ipc", version = "0.1.0" }
nuschel-protocol = { path = "crates/protocol", version = "0.1.0" }
nuschel-storage = { path = "crates/storage", version = "0.1.0" }
nuschel-update = { path = "crates/update", version = "0.1.0" }

nuschel-session = { path = "crates/session", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

# RSA key generation is unusably slow unoptimised; tests and debug builds create identities.
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[patch.crates-io]
pulseaudio = { path = "vendor/pulseaudio" }
# Cross-compilation fixes for GPUI's platform crates (see vendor/*/NUSCHEL-PATCH.md).
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
