[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
exclude = ["vendor/cpal", "vendor/pulseaudio", "vendor/gpui-pre-windows", "vendor/gpui-pre-apple", "vendor/gpui-pre-wgpu", "vendor/gpui-pre"]
default-members = ["apps/desktop", "apps/server"]

[workspace.metadata.crane]
name = "nuschel"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "EUPL-1.2"
publish = false

[workspace.dependencies]
nuschel-core = { path = "crates/core", version = "0.1.0" }
nuschel-client = { path = "crates/client", version = "0.1.0" }
nuschel-content = { path = "crates/content", version = "0.1.0" }
nuschel-ipc = { path = "crates/ipc", version = "0.1.0" }
nuschel-legacy-html = { path = "crates/legacy-html", version = "0.1.0" }
nuschel-protocol = { path = "crates/protocol", version = "0.1.0" }
nuschel-storage = { path = "crates/storage", version = "0.1.0" }
nuschel-update = { path = "crates/update", version = "0.1.0" }
nuschel-identity = { path = "crates/identity", version = "0.1.0" }

nuschel-session = { path = "crates/session", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

# RSA key generation is unusably slow unoptimised; tests and debug builds create identities.
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3
# Key transparency (nuschel-kt): the VRF and tree hashing are ~100x slower unoptimised.
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.akd]
opt-level = 3
[profile.dev.package.akd_core]
opt-level = 3
[profile.dev.package.blake3]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[patch.crates-io]
# Stream names and roles for volume mixers (see vendor/cpal/NUSCHEL-PATCHES.md).
cpal = { path = "vendor/cpal" }
pulseaudio = { path = "vendor/pulseaudio" }
# Cross-compilation fixes for GPUI's platform crates (see vendor/*/NUSCHEL-PATCH.md).
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
# Colour emoji on Linux (vendor/gpui-pre-wgpu/NUSCHEL-PATCH.md).
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }
# Window zoom (Ctrl+= / Ctrl+-) scaling everything like a browser (vendor/gpui-pre/NUSCHEL-PATCH.md).
gpui-pre = { path = "vendor/gpui-pre" }
