[package]
name = "nuschel-cli"
description = "Headless Mumble client using the desktop session implementation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nuschel-session.workspace = true
nuschel-protocol.workspace = true
nuschel-ipc.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
] }

[dev-dependencies]
# End-to-end tests drive this binary against nuscheld on loopback (tests/e2ee.rs).
nuscheld = { path = "../server", version = "0.1.0" }
tempfile = "3.27.0"

[lints]
workspace = true
