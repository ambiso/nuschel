[package]
name = "nuschel-cli"
description = "Headless Mumble client using the desktop session implementation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nuschel-session.workspace = true
nuschel-protocol.workspace = true
nuschel-ipc.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
