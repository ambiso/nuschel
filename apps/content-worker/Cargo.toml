[package]
name = "nuschl-content-worker"
description = "Isolated rich-content parsing process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
nuschl-content.workspace = true
nuschl-core.workspace = true
nuschl-ipc.workspace = true
ureq-proto = { version = "0.7.1", default-features = false, features = ["client"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt"] }

# The launch stage: on Windows the worker starts itself again inside its
# AppContainer (nuschl_sandbox::windows_policy).
[target.'cfg(windows)'.dependencies]
nuschl-sandbox-windows.workspace = true

[lints]
workspace = true
