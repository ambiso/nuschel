[package]
name = "nuschl-crypto-worker"
description = "Isolated process that owns Nuschl's identity secrets and checks key transparency"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "nuschl-crypto-worker"
path = "src/main.rs"

[dependencies]
nuschl-identity.workspace = true
nuschl-ipc.workspace = true
nuschl-kt.workspace = true
nuschl-e2ee.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zeroize = "1.9.1"

[dev-dependencies]
# Loopback tests: nuschld, the real client session and this worker in its sandbox.
nuschld = { path = "../server", version = "0.1.0" }
nuschl-session.workspace = true
nuschl-protocol.workspace = true
# The project auditor, in process, for the loopback test of witnessing.
nuschl-witness = { path = "../witness", version = "0.1.0" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "sync"] }

# The launch stage: on Windows the worker starts itself again inside its
# AppContainer (nuschl_sandbox::windows_policy).
[target.'cfg(windows)'.dependencies]
nuschl-sandbox-windows.workspace = true

[lints]
workspace = true
