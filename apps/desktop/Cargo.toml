[package]
name = "nuschel"
description = "Nuschel GPUI desktop shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
gpui-kit = { version = "0.9.0", default-features = false }
nuschel-client.workspace = true
nuschel-core.workspace = true
nuschel-ipc.workspace = true
nuschel-protocol.workspace = true
nuschel-session.workspace = true
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = [
  "rt",
  "process",
  "io-util",
  "time",
  "rt-multi-thread",
  "sync",
  "fs",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true
