[package]
name = "nuschl"
description = "Nuschl GPUI desktop shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3"
gpui-kit = { version = "0.9.0", default-features = false }
# Only for `frame-timing`: gpui-kit's own `profiler` feature would lock gpui-fast too.
gpui-profiler = { package = "gpui-pre", version = "=0.3.11", optional = true, features = ["profiler"] }
image = { version = "0.25", default-features = false }
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo", "tzdb-bundle-platform"] }
nuschl-client.workspace = true
nuschl-core.workspace = true
nuschl-ipc.workspace = true
nuschl-protocol.workspace = true
nuschl-session.workspace = true
nuschl-update.workspace = true
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = [
  "rt",
  "process",
  "io-util",
  "time",
  "rt-multi-thread",
  "signal",
  "sync",
  "fs",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }

[features]
# Log GPUI's frame phases for measuring (see src/frame_timing.rs).
frame-timing = ["dep:gpui-profiler"]

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "global_shortcuts"] }
# Desktop notifications over D-Bus (already used through ashpd and AccessKit).
zbus = { version = "5.13", default-features = false, features = ["async-io"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
global-hotkey = "0.7"
