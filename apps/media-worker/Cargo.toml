[package]
name = "nuschel-media-worker"
description = "Isolated native audio, codec, and DSP process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cpal = { version = "0.18.2", default-features = false }
nnnoiseless = { version = "0.5.2", default-features = false }
nuschel-core.workspace = true
nuschel-ipc.workspace = true
opus-pure = "0.2.3"
sonora = { version = "0.3.0", default-features = false }

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18.2", default-features = false, features = [
  "pipewire",
  "pulseaudio",
] }
