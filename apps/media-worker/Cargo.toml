[package]
name = "nuschel-media-worker"
description = "Isolated native audio, codec, and DSP process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cpal = { version = "0.18.2", default-features = false }
nnnoiseless = { version = "0.5.2", default-features = false }
nuschel-core.workspace = true
nuschel-ipc.workspace = true
opus-pure = "0.2.3"
rtrb = "0.4"
serde_json = "1.0.154"
sonora = { version = "0.3.0", default-features = false }

# The launch stage: on Windows the worker starts itself again inside its
# AppContainer (nuschel_ipc::windows_sandbox).
[target.'cfg(windows)'.dependencies]
nuschel-sandbox-windows.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18.2", default-features = false, features = [
  "pipewire",
  "pulseaudio",
] }
# Already linked by cpal's PipeWire host; read here to find upstream processing.
pipewire = { version = "0.10.1", default-features = false }

[dev-dependencies]
# Test-only global allocator: proves the device callbacks never allocate.
allocation-counter = "0.8.1"
