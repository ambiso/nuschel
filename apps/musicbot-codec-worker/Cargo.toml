[package]
name = "nuschl-musicbot-codec-worker"
description = "Isolated music decoding, Opus encoding and speech detection for the music bot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nuschl-ipc.workspace = true
audioadapter-buffers = "5.2.0"
# Voice activity detection for ducking (RNNoise).
nnnoiseless = { version = "0.5.2", default-features = false }
opus-pure = "0.2.3"
rubato = "5.0.1"
symphonia = { version = "0.6.1", default-features = false, features = [
  "aac",
  "alac",
  "flac",
  "isomp4",
  "mp3",
  "ogg",
  "pcm",
  "vorbis",
  "wav",
] }

[dev-dependencies]
nuschl-core.workspace = true
nuschl-protocol.workspace = true
tokio = { version = "1.54.1", features = ["macros", "rt", "sync", "time"] }

[lints]
workspace = true
