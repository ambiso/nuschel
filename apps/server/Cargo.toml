[package]
name = "nuscheld"
description = "Nuschel's Mumble-compatible server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "nuscheld"
path = "src/main.rs"

[dependencies]
nuschel-protocol.workspace = true
nuschel-ipc.workspace = true
nuschel-legacy-html.workspace = true
# Key transparency (docs/e2ee.md §5): the directory, and checking what clients
# publish to it.
nuschel-identity.workspace = true
nuschel-kt.workspace = true
async-trait = "0.1.92"
argon2 = { version = "0.5.3", default-features = false, features = [
  "alloc",
  "password-hash",
  "std",
] }
base64 = "0.22"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
prost = "0.14.4"
rcgen = { version = "0.14.10", default-features = false, features = [
  "ring",
  "pem",
] }
regex = "1.13.1"
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = "0.6.5"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = [
  "macros",
  "rt-multi-thread",
  "net",
  "io-util",
  "process",
  "signal",
  "sync",
  "time",
] }
tokio-rustls = { version = "0.26.6", default-features = false, features = [
  "ring",
  "tls12",
] }
toml = { version = "1.2.1", default-features = false, features = [
  "std",
  "parse",
  "serde",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zeroize = "1.9.1"

[dev-dependencies]
# Loopback tests between the real client session and this server.
nuschel-session.workspace = true
tempfile = "3.27.0"

[lints]
workspace = true
