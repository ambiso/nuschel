[package]
name = "nuscheld"
description = "Nuschel Mumble-compatible server entry point"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nuschel-core.workspace = true
nuschel-protocol.workspace = true
nuschel-ipc.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
tokio = { version = "1.54.1", features = [
  "macros",
  "rt-multi-thread",
  "net",
  "io-util",
  "signal",
  "time",
] }
rustls = { version = "0.23.46", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
tokio-rustls = { version = "0.26.6", default-features = false, features = [
  "ring",
  "tls12",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true
