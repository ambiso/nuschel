# nuschld configuration. Every key is optional; the values shown are the defaults.
# Names follow murmur.ini where Murmur has an equivalent.

# "compatible" admits stock Mumble clients and has no end-to-end encryption.
# "e2ee" (end-to-end encrypted conversations, stock clients refused) becomes the
# default once it is implemented; until then the server refuses to start with it.
security = "compatible"

# TCP and UDP. IPv6 sockets are IPv6-only, so both families can be bound.
bind = ["0.0.0.0", "::"]
port = 64738

# Generated certificate and the default database are kept here.
state_directory = "."
# SQLite database, relative to state_directory.
database = "nuschld.sqlite3"
# Or a file containing a sqlite: or postgresql:// URL, read only by the storage worker:
# database_url_file = "/run/credentials/nuschld.service/database-url"

# PEM certificate chain and key. Without them a self-signed certificate is generated
# once and kept in state_directory (clients pin it, so keep it across restarts).
# certificate = "/etc/nuschld/certificate.pem"
# private_key = "/etc/nuschld/private-key.pem"
# SIGHUP loads both again (a renewed certificate); if they do not load, the current
# one stays. "1.3" refuses TLS 1.2, where client certificates travel in the clear;
# Mumble clients built against OpenSSL before 1.1.1 cannot connect then.
minimum_tls_version = "1.2"
# Client certificates issued by these certificate authorities are "strong" (Murmur's
# term): the ACL group `strong` matches them and user statistics say so. Every
# certificate still logs in (Mumble identifies users by its hash). "webpki" (Mozilla's
# roots, built in), "system" (SSL_CERT_FILE or the system's bundle) or PEM files of
# trusted authorities, like murmur.ini's sslCA. Empty: nobody is strong.
strong_certificate_authorities = []
# Log a keyed hash of each client address instead of the address (murmur.ini's
# obfuscate); the key is random per start, so tokens differ after a restart.
obfuscate = false

# The root channel's name; empty shows "Root".
registered_name = ""
welcome_text = ""
# welcome_text_file = "/etc/nuschld/welcome.html"

# Password for unregistered users (registered users log in with their own).
# Keep secrets in files: password_file is read at startup.
password = ""
# password_file = "/run/credentials/nuschld.service/server-password"
# The SuperUser account (user 0) has no password until one is set here or with
# `nuschld --set-superuser-password`; without one it cannot log in.
# superuser_password_file = "/run/credentials/nuschld.service/superuser-password"

max_users = 1000
max_users_per_channel = 0
# Bits per second per user, including protocol overhead.
max_bandwidth = 558000
# Seconds without a message (clients ping every few seconds) before disconnecting.
timeout = 30
# Seconds for TLS and authentication to complete.
handshake_timeout = 10
text_message_length = 5000
image_message_length = 1048576
allow_html = true
default_channel = 0
remember_channel = true
# Seconds; 0 remembers the last channel forever.
remember_channel_duration = 0
allow_ping = true
# Stock clients' server lists send 12-byte pings and expect 24-byte answers. Off: an
# answer is never larger than its request (no amplification of spoofed traffic), so
# stock server lists show no user count. On: answers up to twice the request size,
# rate-limited per address and globally.
allow_ping_amplification = false
certificate_required = false
send_version = true
allow_recording = true
channel_nesting_limit = 10
channel_count_limit = 1000
username_pattern = '[ -=\w\[\]\{\}\(\)\@\|\.]+'
channel_name_pattern = '[ -=\w\#\[\]\{\}\(\)\@\|]+'

# Control messages per second and burst per user (Murmur's messagelimit and
# messageburst). Excess messages are dropped, as stock Murmur does.
message_limit = 1
message_burst = 5
plugin_message_limit = 4
plugin_message_burst = 15
# Channel listeners; leave unset for no limit.
# listeners_per_channel = 50
# listeners_per_user = 10
broadcast_listener_volume_adjustments = false
# suggest_version = "1.5.0"
# suggest_positional = false
# suggest_push_to_talk = true

# Simultaneous connections from one address, unauthenticated connections in total,
# and bytes queued for a client before it is dropped as too slow.
connections_per_address = 16
max_pending_connections = 256
max_queued_bytes = 8388608
# Temporary channels one account or certificate may have at once (0: unlimited);
# one more is refused with a reason.
temporary_channels_per_user = 16
# Voice datagrams per second all whisper and shout targets may fan out to together
# (0: unlimited). A whispered packet over it reaches nobody and the speaker is told.
# Channel voice is not counted.
whisper_fanout_per_second = 500000
# Seconds between "statistics" log lines (connections, logins, messages, voice in
# and out during the interval); 0 turns them off.
statistics_interval = 300

[autoban]
# Connection attempts from one address within timeframe seconds before it is banned
# for duration seconds; 0 attempts disables it.
attempts = 10
timeframe = 120
duration = 300
count_successful = true

[password_hashing]
# argon2id cost for registered users' passwords.
memory_kib = 19456
passes = 2

[history]
# Persistent history for Nuschl clients (docs/extension.md). Unregistered users
# read no history ("none") or the same as registered users ("full"); everyone
# sees live messages.
guests = "none"
# How long messages are kept unless a channel sets its own (ChannelSettings,
# Write on the channel): "forever" (the default), "none" (not archived: live
# delivery only) or a number of days. Shortening it removes older messages
# within the hour. (`retention_days`, with 0 for forever, is the older spelling.)
retention = "forever"
# The most any channel may keep, in days; 0 is no maximum.
max_retention_days = 0
edit_limit = 20
# Users with Write on a channel may delete other people's messages there.
moderators_delete = true
# Stock clients cannot know their messages are kept: their direct messages are
# not stored unless this is on, and they are told about retention.
archive_stock_direct_messages = false
notify_stock_clients = true
pages_per_minute = 120
page_bytes_per_minute = 16777216
# Also per network (IPv4 /24, IPv6 /56) for unregistered users and per account
# for registered ones; exceeding it fails the single page with a retry hint.
network_pages_per_minute = 600
network_page_bytes_per_minute = 67108864
# Networks exempt from the per-network limits, such as ["10.0.0.0/8"].
unlimited_networks = []
# Nuschl client versions (self-reported; stock Mumble clients are never refused
# for theirs). Older clients than recommended_client suggest an update; older
# than minimum_client are refused, from minimum_client_from (a date, midnight
# UTC) on if set, until then warned with the date.
# minimum_client = "0.1.0"
# minimum_client_from = 2026-12-01
# recommended_client = "0.1.0"

[kt]
# Key transparency (docs/e2ee.md §5): a verifiable directory of the identities
# bound to accounts, which Nuschl clients check (`kt/1`).
enabled = true
# The head-signing key (the server's identity key, which clients pin) and the
# VRF secret: files with 32 random bytes or 64 hex digits, passed as credentials
# (never from the Nix store). Without them both are generated once in
# state_directory (kt-signing.key, kt-vrf.key); keep them, a log can never
# change its VRF secret.
# signing_key_file = "/run/credentials/nuschld.service/kt-signing-key"
# vrf_secret_file = "/run/credentials/nuschld.service/kt-vrf-secret"
# Seconds between epochs while bindings wait, and between re-signed heads.
publish_interval = 10
refresh_interval = 3600
lookups_per_minute = 120
histories_per_minute = 60
publishes_per_minute = 6
# Who may fetch an account's history besides its owner: "contacts" (direct
# conversations and the same channel) or "members" (everyone).
history = "contacts"
# Witnessing (docs/witness.md): the names clients reach this server under
# (host:port, lower case), each an origin of the epoch log the witnesses cosign.
# Without one, nothing is submitted.
origins = []
# Submit to Nuschl's built-in witnesses (the project auditor, once deployed).
default_witnesses = true
# Seconds between submissions while new epochs wait, and between refreshes of an
# unchanged checkpoint's cosignatures.
witness_interval = 60
witness_refresh_interval = 3600
# More witnesses (`nuschl-witness vkey` gives the key):
# [[kt.witnesses]]
# key = "witness.example.org/nuschl-kt+122b83c3+BuajLAZT…"
# url = "https://witness.example.org"

[share_links]
# Share links (`share/1`, docs/web.md): the web host this server's links point at,
# one running services.nuschl-web. Empty: the one each client is set to use.
# web_host = "web.example.org"
