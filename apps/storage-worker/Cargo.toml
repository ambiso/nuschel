[package]
name = "nuschel-storage-worker"
description = "Isolated SQLite history process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nuschel-storage.workspace = true
nuschel-ipc.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
tokio = { version = "1.54.1", features = ["macros", "rt", "io-std", "io-util"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Confines --read-murmur (an untrusted file) to reading that one file.
landlock = "0.4.4"

[dev-dependencies]
tempfile = "3.27.0"

# The launch stage: on Windows the worker starts itself again inside its
# AppContainer (nuschel_ipc::windows_sandbox).
[target.'cfg(windows)'.dependencies]
nuschel-sandbox-windows.workspace = true

[lints]
workspace = true
