[package]
name = "nuschl-transfer-worker"
description = "Isolated magic-wormhole file transfer process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-executor = "1.13"
async-io = "2.2"
base64 = "0.22"
blocking = "1.7"
futures = "0.3.12"
magic-wormhole = { version = "0.8.1", default-features = false, features = ["transfer"] }
nuschl-ipc.workspace = true

# The launch stage: on Windows the worker starts itself again inside its
# AppContainer (nuschl_sandbox::windows_policy).
[target.'cfg(windows)'.dependencies]
nuschl-sandbox-windows.workspace = true

[lints]
workspace = true
