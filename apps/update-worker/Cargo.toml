[package]
name = "nuschl-update-worker"
description = "Isolated hybrid update verification primitives and explicit signing tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autobins = false

[features]
default = []
ed25519 = ["dep:curve25519-dalek", "dep:ed25519-dalek"]
mldsa44 = ["dep:ml-dsa"]
signer = ["ed25519", "mldsa44", "dep:getrandom", "ml-dsa/rand_core"]
# Test driver only; never enabled by distributed client/signer packages.
runtime-fixture = ["signer", "nuschl-update/client", "dep:tempfile", "dep:sha2"]

[dependencies]
nuschl-update = { path = "../../crates/update", version = "0.1.0", default-features = false }
curve25519-dalek = { version = "4.1.3", optional = true }
ed25519-dalek = { version = "2.2.0", optional = true, default-features = false, features = ["std", "zeroize"] }
ml-dsa = { version = "0.1.2", optional = true, default-features = false, features = ["alloc", "zeroize"] }
getrandom = { version = "0.4.3", optional = true, features = ["sys_rng"] }
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
zeroize = "1.9.1"
tempfile = { version = "3.27.0", optional = true }
sha2 = { version = "0.10.9", optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "nuschl-update-sign"
path = "src/bin/sign.rs"
required-features = ["signer"]

[[bin]]
name = "nuschl-update-verify-ed25519"
path = "src/bin/verify-ed25519.rs"
required-features = ["ed25519"]

[[bin]]
name = "nuschl-update-verify-mldsa44"
path = "src/bin/verify-mldsa44.rs"
required-features = ["mldsa44"]

[[bin]]
name = "nuschl-update-runtime-fixture"
path = "src/bin/runtime-fixture.rs"
required-features = ["runtime-fixture"]

[target.'cfg(windows)'.dependencies]
nuschl-sandbox-windows.workspace = true

[lints]
workspace = true
