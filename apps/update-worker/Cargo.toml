[package]
name = "nuschl-update-worker"
description = "Isolated hybrid update verification primitives and explicit signing tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autobins = false

[features]
default = []
signer = ["dep:getrandom", "ml-dsa/rand_core"]

[dependencies]
nuschl-update.workspace = true
curve25519-dalek = "4.1.3"
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std", "zeroize"] }
ml-dsa = { version = "0.1.2", default-features = false, features = ["alloc", "zeroize"] }
getrandom = { version = "0.4.3", optional = true, features = ["sys_rng"] }
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "nuschl-update-sign"
path = "src/bin/sign.rs"
required-features = ["signer"]

[lints]
workspace = true
