[package]
name = "nuschl-web-relay"
description = "The web client's WebSocket tunnel to Mumble and Nuschl servers; forwards ciphertext only"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "nuschl-web-relay"
path = "src/main.rs"

# A client without a browser (TLS and a Mumble login through the relay), for
# the loopback test and the vm-web check.
[[bin]]
name = "nuschl-web-relay-probe"
path = "src/bin/probe.rs"

[lints]
workspace = true

[dependencies]
nuschl-protocol.workspace = true
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
prost = "0.14.4"
rand = "0.9"
rustls = { version = "0.23.46", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = [
  "macros",
  "rt-multi-thread",
  "net",
  "io-util",
  "signal",
  "sync",
  "time",
] }
tokio-rustls = { version = "0.26.6", default-features = false, features = [
  "ring",
  "tls12",
] }
tokio-tungstenite = "0.29"
toml = { version = "1.2.1", default-features = false, features = [
  "std",
  "parse",
  "serde",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = [
  "ring",
  "pem",
] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["process"] }
