[package]
name = "nuschl-client"
description = "The headless client SDK: timelines, conversations, server state and policies"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["native"]
# The driver for Linux, Windows and macOS: tokio, the native session and the
# sandboxed workers. Without it the SDK builds for wasm32-unknown-unknown.
native = ["dep:nuschl-ipc", "dep:nuschl-sandbox", "dep:nuschl-session", "dep:tokio", "nuschl-core/uuid"]

[dependencies]
nuschl-link-preview.workspace = true
nuschl-core.workspace = true
nuschl-ipc = { workspace = true, optional = true }
nuschl-legacy-html.workspace = true
nuschl-protocol.workspace = true
nuschl-sandbox = { workspace = true, optional = true }
nuschl-session = { workspace = true, optional = true }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt", "time", "sync", "macros"], optional = true }

[lints]
workspace = true

[dev-dependencies]
# Tests make saved servers, which have random ids.
nuschl-core = { workspace = true, features = ["uuid"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "macros"] }

[[example]]
name = "headless"
required-features = ["native"]
