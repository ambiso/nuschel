[package]
name = "nuschel-client"
description = "The headless client SDK: timelines, conversations, server state and policies"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["native"]
# The driver for Linux, Windows and macOS: tokio, the native session and the
# sandboxed workers. Without it the SDK builds for wasm32-unknown-unknown.
native = ["dep:nuschel-ipc", "dep:nuschel-session", "dep:tokio", "nuschel-core/uuid"]

[dependencies]
nuschel-core.workspace = true
nuschel-ipc = { workspace = true, optional = true }
nuschel-protocol.workspace = true
nuschel-session = { workspace = true, optional = true }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt", "time", "sync", "macros"], optional = true }

[lints]
workspace = true

[dev-dependencies]
# Tests make saved servers, which have random ids.
nuschel-core = { workspace = true, features = ["uuid"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "macros"] }

[[example]]
name = "headless"
required-features = ["native"]
