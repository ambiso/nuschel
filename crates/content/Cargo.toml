[package]
name = "nuschel-content"
description = "Untrusted message parsing and Rust-backed syntax highlighting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
html5ever = "0.40.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
markup5ever_rcdom = "0.40.1"
nuschel-core.workspace = true
pulldown-cmark = { version = "0.13.6", default-features = false }
syntect = { version = "5.3.0", default-features = false, features = [
  "parsing",
  "default-syntaxes",
  "default-themes",
  "regex-fancy",
] }
thiserror = "2.0.21"

[lints]
workspace = true
