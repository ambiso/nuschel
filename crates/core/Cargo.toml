[package]
name = "nuschel-core"
description = "Portable Nuschel domain types and message presentation rules"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
# Random ids for new saved servers, on platforms with a system random source.
uuid = { version = "1.29.1", features = ["v4"], optional = true }

[features]
uuid = ["dep:uuid"]

[dev-dependencies]
serde_json = "1"
