# SPDX-License-Identifier: EUPL-1.2
[package]
name = "nuschel-e2ee"
description = "MLS for Nuschel (docs/e2ee.md §6): OpenMLS with the libcrux provider behind Nuschel's own types; the only crate that uses the OpenMLS API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
nuschel-identity.workspace = true
# OpenMLS 0.9.2 with its libcrux provider. The provider and hpke-rs-libcrux are
# patched onto the fixed libcrux crates (vendor/openmls_libcrux_crypto,
# vendor/hpke-rs-libcrux; RUSTSEC-2026-0329/-0330/-0331) until an OpenMLS release
# carries them and the draft's code points; the bump steps are in docs/e2ee.md,
# "Phase 4 prototype" (TODO.md).
openmls = { version = "=0.9.2", features = ["libcrux-provider", "draft-ietf-mls-pq-ciphersuites"] }
openmls_libcrux_crypto = { version = "=0.4.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_traits = { version = "=0.6.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_memory_storage = { version = "=0.6.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
libcrux-sha2 = "0.0.9"
thiserror = "2.0.21"
zeroize = "1.9.1"
