# SPDX-License-Identifier: EUPL-1.2
[package]
name = "nuschel-e2ee"
description = "MLS for Nuschel (docs/e2ee.md §6): OpenMLS with the libcrux provider behind Nuschel's own types; the only crate that uses the OpenMLS API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
nuschel-identity.workspace = true
# OpenMLS 0.9.2 pins libcrux-kem 0.0.9 and libcrux-hmac-drbg 0.0.1 through
# hpke-rs-libcrux 0.7.0 (RUSTSEC-2026-0329/-0330/-0331, docs/e2ee.md §1.4). This
# crate lives on the `mls` branch until a release with the fixed crates and the
# draft's code points exists; bumping it is described in docs/e2ee.md,
# "Phase 4 prototype".
openmls = { version = "=0.9.2", features = ["libcrux-provider", "draft-ietf-mls-pq-ciphersuites"] }
openmls_libcrux_crypto = { version = "=0.4.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_traits = { version = "=0.6.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_memory_storage = { version = "=0.6.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
libcrux-sha2 = "0.0.9"
thiserror = "2.0.21"
zeroize = "1.9.1"
