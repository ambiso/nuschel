[package]
name = "nuschl-ipc"
description = "Versioned bounded messages for Nuschl worker processes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
nuschl-core.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "macros", "process", "time", "rt", "sync"] }

# Its own binary is the fake worker, so it brings its own main.
[[test]]
name = "exchange"
harness = false

[[test]]
name = "preview"
harness = false

[target.'cfg(windows)'.dependencies]
# Safe wrapper for job objects (kill-on-close containment of workers).
win32job = "2.0.3"

[lints]
workspace = true
