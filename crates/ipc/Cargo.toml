[package]
name = "nuschel-ipc"
description = "Versioned bounded messages for Nuschel worker processes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
nuschel-core.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "process", "time", "rt"] }

[target.'cfg(windows)'.dependencies]
# Safe wrapper for job objects (kill-on-close containment of workers).
win32job = "2.0.3"

[lints]
workspace = true
