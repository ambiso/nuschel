[package]
name = "nuschel-math"
description = "LaTeX math to pixels for the sandboxed math worker: a LaTeX-to-Typst converter and a restricted Typst"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
comemo = "0.5.1"
# Typst lays out in parallel; one formula needs one thread.
rayon = "1.12.0"
typst = "0.15.1"
typst-layout = "0.15.1"
typst-render = "0.15.1"

[lints]
workspace = true
