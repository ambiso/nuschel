[package]
name = "nuschl-math"
description = "LaTeX math to pixels for the sandboxed math worker: a LaTeX-to-Typst converter and a restricted Typst"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
comemo = "0.5.1"
# Typst lays out in parallel; one formula needs one thread.
rayon = "1.12.0"
typst = "0.15.1"
typst-layout = "0.15.1"
typst-render = "0.15.1"
# What Typst reads as a delimiter (its own lexer uses it).
unicode-math-class = "0.1"
# Which characters join the next into one grapheme (as Typst lexes them).
unicode-segmentation = "1.13"

[lints]
workspace = true
