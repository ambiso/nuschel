// SPDX-License-Identifier: EUPL-1.2
// The Nuschel protocol extension (docs/extension.md). Messages use Mumble's
// control framing with types 0x4E00-0x4EFF (see `nuschel::kind`); the hello
// travels in field 7200 of Mumble's `Version`, channel properties in field
// 7200 of `ChannelState`. Nothing here is sent to a peer that did not
// negotiate it (ALPN `nuschel/1` and both hellos).
syntax = "proto3";

package nuschel.v1;

// Field 7200 of `MumbleProto.Version`, from both sides, once, before
// `Authenticate`.
message Hello {
  // 1 for this specification.
  uint32 protocol = 1;
  // At most 32, each ASCII `[a-z0-9-]+/[0-9]+` of at most 64 bytes; unknown
  // ones are ignored. The effective set is the intersection.
  repeated string capabilities = 2;
  // Only from servers.
  Policy policy = 3;
  // Only from servers that offer `kt/1`: the descriptor of the server's
  // key-transparency log (nuschel-kt `LogDescriptor`, at most 512 bytes).
  // Clients pin it like the server (docs/e2ee.md §5.1).
  bytes kt_log = 4;
  // Only from clients: the client's own version, semver ("0.3.0", at most 64
  // bytes), compared with the server's `minimum_client`. Self-reported; a
  // missing or unparsable version is below every minimum.
  string client_version = 5;
  // Only from clients (`privacy/1`): do not disclose this connection's IP
  // address to other clients. Applied before authentication/presence.
  bool relay_only = 6;
}

// 0x4E36, client to server (`privacy/1`): update address privacy for this
// connection. No peer candidates or direct discovery are permitted locally
// while relay_only is set. Server-side address bans still apply.
message Privacy {
  bool relay_only = 1;
}

message Policy {
  enum Mode {
    COMPATIBLE = 0;
    E2EE = 1;
  }
  enum Guests {
    // Unregistered users read no history (they see live messages).
    GUESTS_NONE = 0;
    GUESTS_FULL = 1;
  }
  Mode mode = 1;
  // Nuschel client versions in the 1.5 version format (`major << 48 |
  // minor << 32 | patch << 16`), 0 for none; self-reported and advisory, never
  // a security control (docs/extension.md, "Minimum versions"). Below
  // `recommended_client` the client suggests an update; below
  // `minimum_client` the server refuses it from `minimum_client_from` on.
  uint64 minimum_client = 2;
  uint64 recommended_client = 3;
  // The server's default retention: 0 keeps history forever (unless
  // `live_only`). Channels may set their own (`ChannelInfo`).
  uint32 retention_days = 4;
  Guests guests = 5;
  // How often one message may be edited.
  uint32 edit_limit = 6;
  // Moderators (Write on a channel) may delete others' messages there
  // (`history.moderators_delete`); clients offer it only then.
  bool moderators_delete = 7;
  // The default is "none": not archived, live delivery only.
  bool live_only = 8;
  // Unix time (seconds) from which clients below `minimum_client` are
  // refused; until then they are admitted and shown the date. 0: refused now.
  int64 minimum_client_from = 9;
}

// Decodes only the extension field of a `Version` frame (other fields are
// skipped); appending its encoding to a `Version` adds the hello.
message VersionExtension {
  Hello hello = 7200;
}

// Field 7200 of `MumbleProto.ChannelState`, to Nuschel connections only.
message ChannelInfo {
  // 16 random bytes, never reused.
  bytes conversation = 1;
  Visibility visibility = 2;
  // What the channel keeps (its own retention or the server default, within
  // the server's maximum): 0 keeps history forever, unless `live_only`.
  uint32 retention_days = 3;
  // Not archived: live delivery only, nothing stored, no history pages.
  bool live_only = 4;
  // The channel sets its own retention (otherwise it follows the server's).
  bool own_retention = 5;
}

// A channel's retention in `ChannelSettings`.
message Retention {
  oneof kind {
    // Follow the server's default.
    bool server_default = 1;
    bool forever = 2;
    // 1 to 36500.
    uint32 days = 3;
    // Not archived: live delivery only.
    bool live_only = 4;
  }
}

message ChannelStateExtension {
  ChannelInfo nuschel = 7200;
}

enum Visibility {
  // Members read the retained history, including from before they joined.
  MEMBERS = 0;
  // Only what was said while the reader could read the channel.
  SINCE_ACCESS = 1;
}

enum Format {
  FORMAT_UNSPECIFIED = 0;
  // Literal text; fenced code blocks are the only markup.
  TEXT = 1;
  // Mumble HTML from a stock client, as received; render as inert text.
  LEGACY_HTML = 2;
  // `mls/1`: an MLS application message (PrivateMessage) in `Message.mls`;
  // never shown as text and never copied to stock clients.
  MLS_APPLICATION = 3;
  // `mls/1`: an MLS commit or proposal (PublicMessage) in `Message.mls`.
  // Clients must process every one, in order.
  MLS_HANDSHAKE = 4;
}

// 0x4E00. Errors have stable codes and fixed details.
message Error {
  enum Code {
    UNSPECIFIED = 0;
    // The message type or capability was not negotiated.
    UNSUPPORTED = 1;
    // Out of bounds or undecodable.
    MALFORMED = 2;
    // No such conversation or message, or not allowed: never distinguished.
    NOT_FOUND = 3;
    TOO_LARGE = 4;
    RATE_LIMITED = 5;
    // The idempotency key was used for a different message.
    IDEMPOTENCY_CONFLICT = 6;
    // Storage or the server is busy; retry after `retry_after_ms`.
    BUSY = 7;
    // The `request_id` is already in flight.
    DUPLICATE_REQUEST = 8;
    // More than 16 requests in flight.
    TOO_MANY_REQUESTS = 9;
    // The edit limit was reached.
    LIMIT_REACHED = 10;
    // `mls/1`: the message is for another epoch than the group's current one
    // (`epoch`); fetch the stream after your last seq (up to `head`), process
    // it and retry with the same idempotency key. Also: the conversation
    // already has a group.
    STALE_EPOCH = 11;
    // The change removes stored messages (a shorter retention): the client
    // must show that and resend it with `confirm_expiry`.
    CONFIRMATION_REQUIRED = 12;
  }
  uint64 request_id = 1;
  Code code = 2;
  // Fixed text for the code; never SQL, paths or user text.
  string detail = 3;
  uint64 retry_after_ms = 4;
  // With STALE_EPOCH: the group's current epoch and the conversation's head.
  uint64 epoch = 5;
  uint64 head = 6;
}

message Author {
  // The immutable account id (16 bytes); empty for unregistered users.
  bytes account = 1;
  // Mumble's registration number, a wire alias; 0 when unregistered.
  uint32 user_id = 2;
  // The name when the message was sent.
  string name = 3;
}

message Message {
  enum Kind {
    MESSAGE = 0;
    // Refers to `target`, whose current content is in `content`.
    EDIT = 1;
    // Refers to `target`, which is now a tombstone.
    DELETE = 2;
    // A sequence number that carries nothing (a retried send, or expired).
    VOID = 3;
  }
  uint64 seq = 1;
  Kind kind = 2;
  uint64 target = 3;
  Author author = 4;
  Format format = 5;
  string content = 6;
  uint64 reply_to = 7;
  // Unix milliseconds, from the server.
  int64 sent_ms = 8;
  int64 edited_ms = 9;
  // Set on tombstones: content, reply and attachments are gone.
  int64 deleted_ms = 10;
  // 0 by the author, 1 by a moderator.
  uint32 delete_reason = 11;
  uint32 edits = 12;
  // With format MLS_APPLICATION or MLS_HANDSHAKE: the MLS message (RFC 9420
  // `MLSMessage`); `content` is empty.
  bytes mls = 13;
  // With MLS_APPLICATION: the archive record the sender sealed under the
  // conversation's history key (docs/e2ee.md §6.6), for members who join later.
  bytes archive = 14;
}

// 0x4E01 -> ChatAck or Error.
message ChatSend {
  uint64 request_id = 1;
  bytes conversation = 2;
  // 16 random bytes; scoped to (account, conversation).
  bytes idempotency_key = 3;
  Format format = 4;
  string content = 5;
  // A `seq` in the same conversation, at most its head; 0 for none.
  uint64 reply_to = 6;
}

// 0x4E02, once the message (or edit, deletion) is durably stored.
message ChatAck {
  uint64 request_id = 1;
  bytes conversation = 2;
  uint64 seq = 3;
  int64 server_ms = 4;
}

// 0x4E03, live, to connections that may read the conversation now.
message ChatEvent {
  bytes conversation = 1;
  Message message = 2;
}

// 0x4E04 -> HistoryPage or Error.
message HistoryRequest {
  uint64 request_id = 1;
  bytes conversation = 2;
  oneof anchor {
    bool latest = 3;
    uint64 before = 4;
    uint64 after = 5;
    uint64 around = 6;
  }
  // At most 100.
  uint32 limit = 7;
}

// 0x4E05. Chronological; ends early at the byte cap but never skips.
message HistoryPage {
  uint64 request_id = 1;
  bytes conversation = 2;
  repeated Message messages = 3;
  bool more_before = 4;
  bool more_after = 5;
  // The page stops at the edge of what this reader may see.
  bool restricted = 6;
  uint64 head = 7;
}

// 0x4E06 -> Subscribed. Conversations the reader may not read are left out.
message Subscribe {
  uint64 request_id = 1;
  // At most 64 per message, 256 per connection.
  repeated bytes conversations = 2;
}

message ConversationState {
  bytes conversation = 1;
  uint64 head = 2;
  // The account's read marker (0 if none).
  uint64 read = 3;
}

// 0x4E07
message Subscribed {
  uint64 request_id = 1;
  repeated ConversationState conversations = 2;
}

// 0x4E08, fire and forget.
message Unsubscribe {
  repeated bytes conversations = 1;
}

// 0x4E09, from the server: the reader lost access (or the conversation went).
message Unsubscribed {
  bytes conversation = 1;
}

// 0x4E0A -> ChatAck (with the edit's own seq) or Error.
message ChatEdit {
  uint64 request_id = 1;
  bytes conversation = 2;
  uint64 target = 3;
  Format format = 4;
  string content = 5;
}

// 0x4E0B -> ChatAck or Error.
message ChatDelete {
  uint64 request_id = 1;
  bytes conversation = 2;
  uint64 target = 3;
}

// 0x4E0C, both ways: set (client) and sync to the account's other devices.
message ReadMarker {
  bytes conversation = 1;
  uint64 seq = 2;
}

// 0x4E0D, both ways; never stored.
message Typing {
  bytes conversation = 1;
  // From the server: who types.
  uint32 session = 2;
}

// 0x4E0E -> DirectOpened or Error.
message OpenDirect {
  uint64 request_id = 1;
  // The peer's registration number.
  uint32 user_id = 2;
}

message Direct {
  bytes conversation = 1;
  uint32 user_id = 2;
  string name = 3;
  bytes account = 4;
  uint64 head = 5;
  uint64 read = 6;
}

// 0x4E0F
message DirectOpened {
  uint64 request_id = 1;
  Direct direct = 2;
}

// 0x4E10 -> DirectList.
message ListDirect {
  uint64 request_id = 1;
}

// 0x4E11
message DirectList {
  uint64 request_id = 1;
  repeated Direct directs = 2;
}

// 0x4E12 -> Done or Error. Needs Write on the channel. Absent fields keep
// the channel's current setting.
message ChannelSettings {
  uint64 request_id = 1;
  uint32 channel = 2;
  optional Visibility visibility = 3;
  Retention retention = 4;
  // Needed when `retention` keeps less than the channel keeps now: messages
  // older than the new retention (all of them for live-only) become tombstones
  // within the hour and are no longer served at once. Without it the answer is
  // `CONFIRMATION_REQUIRED` and nothing changes.
  bool confirm_expiry = 5;
}

// 0x4E13, success without a payload.
message Done {
  uint64 request_id = 1;
}

// ---- Key transparency (`kt/1`, docs/e2ee.md §5) ----
// Proofs, heads and certificates travel in nuschel-kt's and
// nuschel-identity's own strict encodings, as opaque bytes.

// 0x4E14 -> KtStatusReply or Error.
message KtStatus {
  uint64 request_id = 1;
  // With `kt-witness/1`: the server as the client reaches it (`host:port`, lower
  // case: the session's sticky key), so that attached checkpoints name the
  // origin `<host>:<port>/nuschel-kt/v1` the client checks (docs/e2ee.md §5.9).
  // Also in `KtLookup` and `KtHistory`.
  string origin = 2;
}

// 0x4E15
message KtStatusReply {
  uint64 request_id = 1;
  // The requester's own account id (16 bytes); empty when unregistered.
  bytes account = 2;
  // The newest signed head (nuschel-kt `SignedHead`).
  bytes head = 3;
  // With `kt-witness/1`: nuschel-kt `WitnessedHead` for `head`: the newest
  // cosigned checkpoint of the server's epoch log under the requested origin
  // and the head's inclusion proof (at most 72 KiB). Empty when the server has
  // no checkpoint under that origin. Also in `KtLookupReply` and
  // `KtHistoryReply`, for their heads.
  bytes witnessed = 4;
  // With `kt-witness/1`, for registered requesters: their registration number
  // and the name their `name:` label carries (lower case), which they monitor.
  optional uint32 user_id = 5;
  string name = 6;
}

// The certificates behind an account's binding: what the log's roster
// commitment and statement hash refer to.
message KtRecord {
  // nuschel-identity `DeviceSigningCertificate`.
  bytes device_signing_certificate = 1;
  // `DeviceCertificate`s, at most 16.
  repeated bytes devices = 2;
  // `DeviceRevocation`s, at most 32.
  repeated bytes revocations = 3;
  // The identity's `AccountStatement` for this account on this log.
  bytes statement = 4;
}

// 0x4E16 -> KtPublished or Error. Binds the sender's own account (registered
// users only) to an identity; the statement and every certificate must
// verify under `root`, and the statement must name this account and log.
message KtPublish {
  uint64 request_id = 1;
  // nuschel-identity `HybridPublicKey`: the identity root.
  bytes root = 2;
  KtRecord record = 3;
}

// 0x4E17
message KtPublished {
  uint64 request_id = 1;
  // The `acct:` value (nuschel-kt `DirectoryValue`) the server publishes.
  bytes value = 2;
  // True if it is already the current value; otherwise it is published in
  // the next epoch (within about ten seconds).
  bool current = 3;
}

// 0x4E18 -> KtLookupReply or Error. Any registered account on this server.
message KtLookup {
  uint64 request_id = 1;
  oneof target {
    // A registration number (Mumble's wire alias).
    uint32 user_id = 2;
    // An account id (16 bytes).
    bytes account = 3;
  }
  string origin = 4;
}

// 0x4E19
message KtLookupReply {
  uint64 request_id = 1;
  bytes account = 2;
  // nuschel-kt `LookupResponse` for the account's `acct:` label.
  bytes response = 3;
  KtRecord record = 4;
  bytes witnessed = 5;
  // With `kt-witness/1`, for a lookup by registration number: the
  // `LookupResponse` of its `reg:` label, whose value names `account`; and of
  // the `name:` label of the user's current name (`name`, lower case). All
  // three responses carry the same head.
  bytes registration = 6;
  bytes name_lookup = 7;
  string name = 8;
}

// 0x4E1A -> KtHistoryReply or Error. Only for the requester's own account
// and their contacts.
message KtHistory {
  uint64 request_id = 1;
  bytes account = 2;
  string origin = 3;
  // With `kt-witness/1`: which of the account's labels; the `reg:` and `name:`
  // labels only for the requester's own account (self-monitoring).
  KtLabel label = 4;
}

enum KtLabel {
  KT_LABEL_ACCOUNT = 0;
  KT_LABEL_REGISTRATION = 1;
  KT_LABEL_NAME = 2;
}

// 0x4E1B
message KtHistoryReply {
  uint64 request_id = 1;
  bytes account = 2;
  // nuschel-kt `HistoryResponse`.
  bytes response = 3;
  bytes witnessed = 4;
  KtLabel label = 5;
}

// 0x4E1C -> KtAuditReply or Error (`TOO_LARGE`: audit a shorter span, with
// `KtHead` for the epoch in between).
message KtAudit {
  uint64 request_id = 1;
  uint64 from_epoch = 2;
  uint64 to_epoch = 3;
}

// 0x4E1D
message KtAuditReply {
  uint64 request_id = 1;
  // nuschel-kt `AuditResponse`.
  bytes response = 2;
}

// 0x4E1E -> KtHeadReply or Error: the newest head of an earlier epoch.
message KtHead {
  uint64 request_id = 1;
  uint64 epoch = 2;
}

// 0x4E1F
message KtHeadReply {
  uint64 request_id = 1;
  bytes head = 2;
}

// ---- MLS (`mls/1`, docs/e2ee.md §6.3) ----
// Key packages, MLS messages, GroupInfo, Welcomes and ratchet trees travel in
// their RFC 9420 TLS encodings as opaque bytes. Commits, proposals and
// application messages share the conversation's `seq` stream: they come back
// in `ChatEvent` and `HistoryPage` as messages with format MLS_HANDSHAKE or
// MLS_APPLICATION. Welcomes are not in the stream; they wait in a mailbox per
// device. `mls/1` needs `kt/1`: credentials are checked against key
// transparency.

// 0x4E20 -> MlsKeyPackageStatus or Error. For the uploader's own devices
// (each credential's identity must be the one the account's key-transparency
// record binds, and the device in its roster); registered users only.
message MlsKeyPackageUpload {
  uint64 request_id = 1;
  // One-time key packages, at most 16 per upload; the server keeps at most 50
  // per device (the oldest go first).
  repeated bytes key_packages = 2;
  // Replaces the device's last-resort key package, if set.
  bytes last_resort = 3;
}

// 0x4E21
message MlsKeyPackageStatus {
  uint64 request_id = 1;
  // The uploading device's one-time key packages left, and whether it has a
  // last-resort one.
  uint32 one_time = 2;
  bool last_resort = 3;
}

// 0x4E22 -> MlsKeyPackages or Error. One key package per device of `account`
// (one-time ones are consumed; a device without one gives its last-resort
// package). Only for one's own account and direct-conversation partners;
// rate-limited per account.
message MlsKeyPackageClaim {
  uint64 request_id = 1;
  bytes account = 2;
}

// 0x4E23
message MlsKeyPackages {
  uint64 request_id = 1;
  bytes account = 2;
  // At most 16 (the key-transparency roster's device limit).
  repeated bytes key_packages = 3;
}

// A new conversation group: its epoch-0 GroupInfo and ratchet tree.
message MlsGroupInit {
  bytes group_info = 1;
  bytes tree = 2;
}

// 0x4E24 -> MlsAck or Error. A commit for the group's current epoch, with
// the committer's GroupInfo for the new epoch and, when it adds devices, the
// Welcome for them (without a ratchet tree: joiners fetch the server's).
message MlsCommit {
  uint64 request_id = 1;
  bytes conversation = 2;
  // 16 random bytes; a retry with the same key and commit returns the
  // original acknowledgement.
  bytes idempotency_key = 3;
  bytes commit = 4;
  bytes group_info = 5;
  bytes welcome = 6;
  // Registers the conversation's group (generation 0) first; refused with
  // STALE_EPOCH when it already has one.
  MlsGroupInit create = 7;
}

// 0x4E25, once the message is durably stored.
message MlsAck {
  uint64 request_id = 1;
  bytes conversation = 2;
  uint64 seq = 3;
  // The group's epoch after the message.
  uint64 epoch = 4;
}

// 0x4E26 -> MlsAck or Error. An application message (PrivateMessage) for the
// group's current epoch.
message MlsSend {
  uint64 request_id = 1;
  bytes conversation = 2;
  bytes idempotency_key = 3;
  bytes message = 4;
  // The archive record of the same envelope (docs/e2ee.md §6.6), kept with the
  // row for members who join later; empty when there is none.
  bytes archive = 5;
}

// A Welcome waiting for a device.
message MlsWelcome {
  // The mailbox entry, for MlsWelcomeAck.
  bytes id = 1;
  bytes conversation = 2;
  // The commit that added the device, and the epoch it led to.
  uint64 seq = 3;
  uint64 epoch = 4;
  bytes welcome = 5;
}

// 0x4E27, pushed to the device's connection when a commit adds it.
message MlsWelcomePush {
  MlsWelcome welcome = 1;
}

// 0x4E28 -> MlsWelcomes. The mailbox of one of the requester's devices (the
// device id from its credential, 16 bytes); also subscribes the connection to
// pushes for it.
message MlsWelcomeFetch {
  uint64 request_id = 1;
  bytes device = 2;
}

// 0x4E29
message MlsWelcomes {
  uint64 request_id = 1;
  // At most 32; fetch again after acknowledging them.
  repeated MlsWelcome welcomes = 2;
}

// 0x4E2A -> Done. Deletes processed Welcomes from the device's mailbox.
message MlsWelcomeAck {
  uint64 request_id = 1;
  bytes device = 2;
  // At most 32.
  repeated bytes ids = 3;
}

// 0x4E2B -> MlsJoinInfo or Error (NOT_FOUND: no group, or not allowed).
message MlsJoinInfoRequest {
  uint64 request_id = 1;
  bytes conversation = 2;
  // Include the ratchet tree (Welcome recipients need it).
  bool tree = 3;
}

// 0x4E2C
message MlsJoinInfo {
  uint64 request_id = 1;
  bytes conversation = 2;
  uint64 epoch = 3;
  // The newest GroupInfo (member-signed) and the server's ratchet tree.
  bytes group_info = 4;
  bytes tree = 5;
  // The seq of the newest commit.
  uint64 commit_seq = 6;
  // The accounts of the group's member devices, as the server knows them (it
  // admitted each by its key-transparency record); look them up before joining,
  // so their credentials can be checked. At most 4096.
  repeated bytes accounts = 7;
}

// ---- MLS channels (phase 4c, docs/e2ee.md §6.2) ----
// A channel's group holds the devices that opened the channel: a device joins by
// external commit (`MlsCommit` without `create`, after `MlsJoinInfoRequest`) when
// it first opens the channel, and the server proposes removals (lost `can_read`,
// a device inactive for 90 days, a channel not opened for 30 days) as external
// proposals in the stream, which one member commits when asked. Every device that
// may read the channel still gets its rows (ciphertext) and heads, so it knows
// where conversations happen without being a member.

// 0x4E2D, pushed to one member device at a time (never a storm of committers).
message MlsTask {
  bytes conversation = 1;
  // The epoch the task is for; a device whose group is past it ignores it.
  uint64 epoch = 2;
  // Commit the server's pending removals (`MlsCommit`), after reading the stream
  // up to them.
  bool commit = 3;
  // Send the history keys to the group (a device joined; `members` history,
  // docs/e2ee.md §6.6).
  bool grant = 4;
}

// 0x4E2E, fire and forget: this connection's device (the one whose Welcome
// mailbox it fetched) has the conversation open. A channel member that opens it
// within 30 days stays in its group.
message MlsOpened {
  bytes conversation = 1;
}

// ---- share/1: share links (docs/web.md, "Share links"), 0x4E90-0x4E97 ----

// 0x4E90 -> ShareLink or Error. A link that opens `channel`. Registered users
// who may enter the channel; an access token needs Write on it.
message ShareLinkCreate {
  uint64 request_id = 1;
  uint32 channel = 2;
  // Unix seconds; 0 for a link that does not expire.
  uint64 expires_at = 3;
  // An access token (Mumble's #token ACL groups, at most 128 bytes) handed to
  // whoever opens the link, so it can open a private channel.
  string access_token = 4;
}

// 0x4E91: a created or resolved link.
message ShareLink {
  uint64 request_id = 1;
  // 16 bytes; base64url in links.
  bytes token = 2;
  uint32 channel = 3;
  uint64 expires_at = 4;
  string access_token = 5;
  // The web host the server's operator chose for its links; empty: the client's.
  string web_host = 6;
}

// 0x4E92 -> Done or Error (NOT_FOUND). By the creator or someone with Write on
// the link's channel.
message ShareLinkRevoke {
  uint64 request_id = 1;
  bytes token = 2;
}

// 0x4E93 -> ShareLink or Error (NOT_FOUND: unknown, revoked, expired, or the
// channel is gone). Any authenticated connection, rate-limited.
message ShareLinkResolve {
  uint64 request_id = 1;
  bytes token = 2;
}
