[package]
name = "nuschel-storage"
description = "SQLx SQLite/PostgreSQL persistence, confined to the storage worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nuschel-core.workspace = true
sqlx = { version = "0.9.0", default-features = false, features = [
  "runtime-tokio",
  "sqlite-bundled",
  "postgres",
  "tls-rustls-ring-webpki",
  "migrate",
  "macros",
] }
thiserror = "2.0.21"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
