# SPDX-License-Identifier: EUPL-1.2
[package]
name = "nuschl-stream"
description = "Screen-share key agreement: watch links, the X-Wing HPKE-PSK exchange and rekeying (docs/screen-share-plan.md §3)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64ct = "1.8.3"
# The X-Wing HPKE suite and libcrux code of crates/identity/src/hpke.rs. No system RNG:
# callers pass one, so the crate builds unchanged for wasm32.
hpke-rs = "0.8.0"
hpke-rs-libcrux = { version = "0.8.0", default-features = false }
libcrux-chacha20poly1305 = "0.0.10"
libcrux-hkdf = "0.0.9"
# 0.0.10 fixes RUSTSEC-2026-0330 and RUSTSEC-2026-0331.
libcrux-kem = { version = "0.0.10", default-features = false }
libcrux-sha2 = "0.0.9"
rand_core = "0.10.1"
subtle = "2.6.1"
thiserror = "2.0.21"
zeroize = "1.9.1"
