[package]
name = "nuschl-update"
description = "Signed in-place updates for the Windows and macOS builds"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["client"]
client = ["dep:cap-std", "dep:ureq", "dep:nuschl-ipc", "dep:tokio"]

[dependencies]
# Every file operation goes through a handle on the installation folder:
# absolute paths, `..` and symlinks leading outside are refused.
cap-std = { version = "4.0.3", optional = true }
hex = "0.4.3"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
thiserror = "2.0.21"
url = "2.5.8"
# HTTPS through rustls with ring and Mozilla's roots, as the Mumble connection uses.
ureq = { version = "3", optional = true, default-features = false, features = ["rustls"] }

nuschl-ipc = { workspace = true, optional = true }
tokio = { version = "1.54.1", optional = true, features = ["io-util", "process", "time", "rt"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
