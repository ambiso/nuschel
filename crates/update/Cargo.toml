[package]
name = "nuschl-update"
description = "Signed in-place updates for the Windows and macOS builds"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Every file operation goes through a handle on the installation folder:
# absolute paths, `..` and symlinks leading outside are refused.
cap-std = "4.0.3"
# Pure Rust, no dependencies: verifies the release manifest's signature.
minisign-verify = "0.2"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
thiserror = "2.0.21"
url = "2.5.8"
# HTTPS through rustls with ring and Mozilla's roots, as the Mumble connection uses.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
minisign = "0.7"
tempfile = "3.27.0"

[lints]
workspace = true
