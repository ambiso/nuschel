# Nuschel is EUPL-1.2. Dependency licenses are reviewed independently;
# cargo-deny checks SPDX expressions, not legal compatibility or attribution.
[graph]
all-features = true

[advisories]
unmaintained = "all"
yanked = "deny"
# Unmaintained-only transitive dependencies, reviewed in docs/dependency-review.md.
# Vulnerability and unsoundness advisories remain errors, including new advisories
# against any of these packages.
ignore = [
  { id = "RUSTSEC-2025-0141", reason = "Syntect 5.3 loads its trusted bundled syntax/theme dumps with bincode 1.3.3, inside the content worker" },
  { id = "RUSTSEC-2024-0384", reason = "gpui-base 0.9 uses instant; remove when upstream migrates to web-time" },
  { id = "RUSTSEC-2024-0436", reason = "Transitive compile-time paste macros; current GPUI/DSP dependencies have not migrated" },
  { id = "RUSTSEC-2026-0206", reason = "GPUI snapshot uses rustybuzz via usvg; no remote fonts or SVG are accepted by Nuschel's message renderer" },
  { id = "RUSTSEC-2026-0192", reason = "GPUI's text/SVG stack still uses ttf-parser; desktop native-rendering exception" },
  { id = "RUSTSEC-2026-0371", reason = "GPUI's accessibility/portal stack depends on zbus 5; upstream migration to zbus 6 is required" },
  { id = "RUSTSEC-2026-0370", reason = "GPUI's accessibility/portal stack depends on zbus 5 and its zvariant wire types" },
  { id = "RUSTSEC-2026-0372", reason = "The zvariant derive macros migrate together with the GPUI/accessibility zbus 6 upgrade" },
]

[licenses]
confidence-threshold = 0.95
allow = [
  "EUPL-1.2",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
  { name = "openssl", reason = "Use rustls for transport security" },
  { name = "openssl-sys", reason = "Avoid adding an OpenSSL FFI dependency" },
  { name = "onig", reason = "Use Syntect's Rust fancy-regex backend in the content worker" },
  { name = "onig_sys", reason = "Keep native regex parsing out of the content pipeline" },
  { name = "gpui-kit", wrappers = [
    "nuschel",
  ], reason = "GPUI is an explicit desktop rendering exception" },
  { name = "cpal", wrappers = [
    "nuschel-media-worker",
  ], reason = "Native audio APIs belong in the media worker" },
  { name = "opus-pure", wrappers = [
    "nuschel-media-worker",
  ], reason = "Keep codec SIMD and packet processing in the media worker" },
  { name = "sonora", wrappers = [
    "nuschel-media-worker",
  ], reason = "DSP runs outside the UI and network session" },
  { name = "nnnoiseless", wrappers = [
    "nuschel-media-worker",
  ], reason = "Keep speech processing on the media execution path" },
  { name = "sqlx", wrappers = [
    "nuschel-storage",
  ], reason = "SQLx drivers, SQLite FFI, and database credentials are confined to storage" },
  { name = "nuschel-storage", wrappers = [
    "nuschel-storage-worker",
  ], reason = "Do not link SQLite into the UI, client, or server" },
  { name = "syntect", wrappers = [
    "nuschel-content",
  ], reason = "Untrusted grammars and message parsing belong in the content worker" },
  { name = "nuschel-content", wrappers = [
    "nuschel-content-worker",
  ], reason = "The UI consumes typed text spans over IPC" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[[bans.features]]
name = "sqlx"
deny = ["sqlite-load-extension", "sqlite-deserialize"]

[[bans.features]]
name = "sqlx-sqlite"
deny = ["load-extension", "deserialize"]
