# SPDX-License-Identifier: EUPL-1.2
# libFuzzer targets; needs nightly and cargo-fuzz, so it is its own workspace,
# outside the default build: `just fuzz html` (nightly and cargo-fuzz from the
# flake's fuzz shell), or `cargo +nightly fuzz run html` here. Cargo.lock is
# committed and pins what the main workspace's lock does (SECURITY.md, "Fuzzing").
[package]
name = "nuschl-fuzz"
version = "0.0.0"
edition = "2024"
license = "EUPL-1.2"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
nuschl-audio-jitter = { path = "../crates/audio-jitter", version = "0.1.0" }
libfuzzer-sys = "0.4"
nuschl-content = { path = "../crates/content" }
nuschl-math = { path = "../crates/math" }
pulldown-cmark = { version = "0.13.6", default-features = false }
nuschl-core = { path = "../crates/core" }
nuschl-protocol = { path = "../crates/protocol" }
nuschld = { path = "../apps/server" }
bytes = "1.12.1"
prost = "0.14.4"
nuschl-identity = { path = "../crates/identity" }
nuschl-ipc = { path = "../crates/ipc" }
nuschl-kt = { path = "../crates/kt" }
nuschl-e2ee = { path = "../crates/e2ee" }
serde_json = "1.0.154"
base64 = "0.22"
image = { version = "0.25", default-features = false }
nuschl-client = { path = "../crates/client" }
nuschl-legacy-html = { path = "../crates/legacy-html" }
nuschl-session = { path = "../crates/session" }
opus-pure = "0.2.3"

[[bin]]
name = "html"
path = "fuzz_targets/html.rs"
test = false
doc = false
bench = false

