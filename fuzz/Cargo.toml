# SPDX-License-Identifier: EUPL-1.2
# libFuzzer targets; needs nightly and cargo-fuzz, so it is its own workspace,
# outside the default build: `just fuzz html` (nightly and cargo-fuzz from the
# flake's fuzz shell), or `cargo +nightly fuzz run html` here. Cargo.lock is
# committed and pins what the main workspace's lock does (SECURITY.md, "Fuzzing").
[package]
name = "nuschel-fuzz"
version = "0.0.0"
edition = "2024"
license = "EUPL-1.2"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
nuschel-content = { path = "../crates/content" }
nuschel-core = { path = "../crates/core" }
nuschel-protocol = { path = "../crates/protocol" }
nuscheld = { path = "../apps/server" }
bytes = "1.12.1"
prost = "0.14.4"
nuschel-identity = { path = "../crates/identity" }
nuschel-ipc = { path = "../crates/ipc" }
nuschel-kt = { path = "../crates/kt" }
serde_json = "1.0.154"

[[bin]]
name = "html"
path = "fuzz_targets/html.rs"
test = false
doc = false
bench = false

[[bin]]
name = "server_messages"
path = "fuzz_targets/server_messages.rs"
test = false
doc = false
bench = false

[[bin]]
name = "control_frames"
path = "fuzz_targets/control_frames.rs"
test = false
doc = false
bench = false

[[bin]]
name = "relay"
path = "fuzz_targets/relay.rs"
test = false
doc = false
bench = false

[[bin]]
name = "extension_messages"
path = "fuzz_targets/extension_messages.rs"
test = false
doc = false
bench = false

[[bin]]
name = "crypt"
path = "fuzz_targets/crypt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "identity"
path = "fuzz_targets/identity.rs"
test = false
doc = false
bench = false

[[bin]]
name = "kt"
path = "fuzz_targets/kt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "kt_messages"
path = "fuzz_targets/kt_messages.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[profile.release]
debug = 1
