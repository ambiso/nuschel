# The workspace's patch of OpenMLS 0.9.2's libcrux provider onto the fixed libcrux
# crates (vendor/*/NUSCHEL-PATCH.md), so the mls target fuzzes what ships.
[patch.crates-io]
hpke-rs-libcrux = { path = "../vendor/hpke-rs-libcrux" }
openmls_libcrux_crypto = { path = "../vendor/openmls_libcrux_crypto" }
