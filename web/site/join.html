<!doctype html>
<!-- SPDX-License-Identifier: EUPL-1.2 -->
<!-- The share-link landing page (docs/web.md, "Share links"). Everything about the
     server is in the link's fragment, which the browser never sends; this page
     loads nothing from elsewhere and counts nothing. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Join on Nuschel</title>
  <link rel="icon" href="/nuschel.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/join.js" defer></script>
</head>
<body>
  <main>
    <img class="logo" src="/nuschel.svg" alt="">
    <h1 id="title">Join on Nuschel</h1>
    <p class="where" id="where">Reading the link…</p>
    <ul class="actions" id="actions" hidden>
      <li><a class="button primary" id="open-app" href="#">Open in Nuschel</a></li>
      <li><a class="button" id="open-web" href="/">Join in the browser</a></li>
      <li><a class="button" data-install href="https://github.com/ambiso/nuschel/releases/latest">Get Nuschel</a></li>
    </ul>
    <p class="note" id="status" role="status" aria-live="polite"></p>
    <details id="details" hidden>
      <summary>Connection details</summary>
      <p>Server: <code id="detail-server"></code></p>
      <p id="detail-pin-row">Certificate (SHA-256): <code id="detail-pin"></code></p>
      <p id="detail-policy" hidden>Nuschel servers only: the app refuses a plain Mumble server at this address.</p>
    </details>
    <noscript><p class="note">This page needs JavaScript to read the link. Nothing is sent anywhere.</p></noscript>
  </main>
</body>
</html>
